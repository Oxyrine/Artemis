[project]
name = "artemis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "pyyaml>=6",
    "sqlalchemy>=2.1.6",
    "rapidfuzz>=3.14.6",
    "pandas>=3.1.0",
    "openpyxl>=3.1.5",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["live: needs LLM_API_KEY, run via make test-live"]
addopts = "-m 'not live'"

[tool.setuptools.packages.find]
include = ["artemis*", "eval*"]
